spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
cloudinary.cloud_name=${CLOUD_NAME}
cloudinary.api_key=${CLOUD_API_KEY}
cloudinary.api_secret=${CLOUD_API_SECRET}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
jwt.secret=${JWT_SECRET}

# EmailJS (pengirim email OTP lupa password). Isi lewat Secrets di Hugging Face, JANGAN ditulis di sini.
emailjs.service-id=${EMAILJS_SERVICE_ID:}
emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
